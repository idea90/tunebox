[pytest]
asyncio_mode = auto
testpaths = tests
markers =
    real_session: use the real session save/restore
    real_mediakeys: use the real media-key module
    real_recs: use the real personal-shelf queries
    real_clipboard: use the real system clipboard
    real_inline: use the real graphics-protocol state
    real_mpris: use the real MPRIS service (talks to a private D-Bus session bus)
    real_cover_lookup: use the real online cover-art lookup
