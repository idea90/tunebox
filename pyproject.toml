[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tunebox"
version = "1.4.1"
description = "A YouTube Music client for the terminal, with full mouse and keyboard support."
authors = [{ name = "Tunebox Team" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "textual>=1.0.0",
    "ytmusicapi>=1.12.0",
    "yt-dlp>=2024.0.0",
    "pygame>=2.5.0",
    "rich>=13.0.0",
    "requests>=2.30.0",
    "imageio-ffmpeg>=0.5.0",
    "mutagen>=1.47.0",
    "Pillow>=12.1",
    "textual-image>=0.14",
    "numpy>=1.24",
    "dbus-next>=0.2.3; sys_platform == 'linux'",
]

[project.optional-dependencies]
media = ["pynput>=1.7"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
tunebox = "tunebox.main:main"

[tool.setuptools.packages.find]
include = ["tunebox*"]
